<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Catálogo de Armas — GymBattle</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #e8e8ee; background: #0c0c12; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.cover, .divider, .page { width: 210mm; height: 297mm; page-break-after: always; overflow: hidden; }
.cover { display: flex; flex-direction: column; justify-content: center; padding: 30mm; background: radial-gradient(circle at 70% 30%, #2a2a10, #0c0c12 60%); }
.brand { color: #c8ff3a; letter-spacing: .4em; font-weight: 900; margin: 0; }
.cover h1 { font-size: 54px; margin: 8px 0; }
.sub { color: #9a9aa8; font-size: 18px; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.legend span { border: 1px solid var(--rc); color: var(--rc); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.toc { margin-top: 30px; columns: 2; font-size: 15px; color: #c8c8d4; padding-left: 20px; }
.toc li { margin-bottom: 6px; } .toc b { color: #c8ff3a; }
.divider { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(160deg, #15151f, #0c0c12); }
.divider p:first-child { color: #c8ff3a; letter-spacing: .3em; text-transform: uppercase; font-weight: 800; margin: 0; }
.divider h1 { font-size: 46px; margin: 10px 0; }
.page { padding: 10mm 12mm; display: flex; flex-direction: column; gap: 9mm; }
.card { position: relative; flex: 1 1 0; border: 2px solid var(--rc); border-radius: 14px; padding: 7mm; background: linear-gradient(160deg, #17171f, #101016); box-shadow: inset 0 0 40px -20px var(--rc); display: flex; flex-direction: column; gap: 4mm; overflow: hidden; }
.num { position: absolute; top: 5mm; right: 6mm; color: #55556a; font-weight: 800; font-size: 13px; }
.top { display: flex; gap: 7mm; }
.img { width: 52mm; height: 52mm; flex: none; border-radius: 12px; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 22%, transparent), #0b0b10 70%); border: 1px solid #2a2a36; }
.img img { width: 48mm; height: 48mm; }
.info { flex: 1; min-width: 0; }
.rar { margin: 0; color: var(--rc); font-weight: 900; letter-spacing: .18em; font-size: 11px; text-transform: uppercase; }
h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.15; }
.cat { margin: 2px 0 8px; color: #9a9aa8; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.stats div { background: #1d1d28; border-radius: 8px; padding: 5px 7px; }
i { display: block; font-style: normal; color: #8a8a98; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; }
.stats b { font-size: 13.5px; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 4px; font-size: 12px; }
.row > i { width: 70px; }
.chip { background: #23232f; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; }
.chip b { color: #c8ff3a; }
.muted { color: #6a6a78; }
.lore { margin: 0; font-style: italic; color: #b8b8c8; font-size: 12.5px; border-left: 3px solid var(--rc); padding-left: 10px; }
.atks { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; flex: 1; }
.atk { background: #15151d; border: 1px solid #262632; border-radius: 10px; padding: 9px 11px; }
.atk-h { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.slot { font-size: 9.5px; font-weight: 900; color: #0c0c12; background: #c8ff3a; border-radius: 4px; padding: 1px 5px; }
.atk-h b { font-size: 14px; }
.kind { font-size: 10.5px; color: #9a9aa8; }
.desc { margin: 5px 0 7px; font-size: 11.5px; color: #c8c8d4; line-height: 1.35; }
.nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.nums span { background: #1e1e2a; border-radius: 6px; padding: 3px 5px; font-size: 12px; font-weight: 700; }
.nums i { font-size: 8.5px; }
.extra { margin: 6px 0 0; font-size: 11px; color: #ffd86b; }
</style></head><body><div id="root"></div><script src="page.js"></script></body></html>
